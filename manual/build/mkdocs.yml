# MkDocs configuration for the web build of the ADS manual.
# Usage (from the manual/build/ directory, after `make snippets figures`):
#     mkdocs serve -f mkdocs.yml      # local preview at http://127.0.0.1:8000
#     mkdocs build -f mkdocs.yml      # static site into ../../manual-site/
#
# docs_dir points at the manual root so that index.md, chapters/, and
# figures/ are all visible; relative image links (../figures/NAME.svg)
# resolve correctly from the chapter files.

site_name: ADS — A User Manual
site_description: A user manual for ADS 0.1.0, algorithms and data structures in C++20.
site_author: Donato Meoli
docs_dir: ..
# site_dir must live OUTSIDE docs_dir (which is the manual root); write the
# generated static site as a sibling of manual/.
site_dir: ../../manual-site
use_directory_urls: false

# docs_dir is the manual root, which also holds files that are not manual
# pages; keep them out of the generated site. NOTE: build/katex-init.js IS
# needed at runtime (math rendering), so exclude build/ selectively rather
# than wholesale (the same holds for build/figcaption.js). generated/ holds
# the snippets that the chapters include.
exclude_docs: |
  build/Makefile
  build/*.yml
  build/*.yaml
  build/*.lua
  build/*.tex
  build/*.py
  generated/
  figures/*.tex
  OUTLINE.md
  MAINTENANCE.md
  ADS-manual.pdf
  .DS_Store

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  # the code and the pseudocode of the headers, extracted by snarf.py
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - build/figcaption.js
  - build/katex-init.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

nav:
  - Front matter: index.md
  - Part I — Foundations:
      - 1. Introduction: chapters/01-introduction.md
      - 3. Stacks: chapters/03-stack.md
      - 5. Memory management: chapters/05-memory.md
  - Part II — Searching and ordering:
      - 6. Searching: chapters/06-search.md
      - 7. Hashing and dictionaries: chapters/07-dictionary.md
      - 9. Priority queues: chapters/09-priority.md
      - 10. Sets and filters: chapters/10-set.md
      - 11. Disjoint sets: chapters/11-mfset.md
      - 12. Sorting: chapters/12-sort.md
  - Part III — Algorithms:
      - 13. Algorithm design: chapters/13-algorithm.md
      - 14. Graphs: chapters/14-graph.md
      - 15. Strings: chapters/15-string.md
      - 16. Geometry: chapters/16-geometry.md
      - 17. Numerical algorithms: chapters/17-numeric.md
      - 18. Combinatorial generation: chapters/18-combinatorial.md
      - 19. Backtracking: chapters/19-backtrack.md
      - 20. Complexity and intractable problems: chapters/20-complexity.md
  - Part IV — Engineering:
      - 21. Compression: chapters/21-compression.md
      - 22. Succinct structures: chapters/22-succinct.md
      - 23. External memory: chapters/23-external.md
      - 24. Concurrency: chapters/24-concurrent.md
      - 25. Parallelism: chapters/25-parallel.md
      - 26. Distributed computing: chapters/26-distributed.md
  - Back matter:
      - Bibliography: chapters/Z-bibliography.md
