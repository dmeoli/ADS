# Pandoc defaults for the PDF build of the ADS manual.
# Usage (from the manual/build/ directory):
#     pandoc --defaults=pandoc.yaml -o ../ADS-manual.pdf
# All paths are relative to manual/build/ (the intended working directory).

from: markdown+tex_math_dollars+pipe_tables+fenced_code_attributes
to: latex

# Single source, assembled in reading order. Keep this list in sync with
# the MkDocs nav in mkdocs.yml.
input-files:
  - ../index.md
  - ../chapters/01-introduction.md
  - ../chapters/02-sequence.md
  - ../chapters/03-stack.md
  - ../chapters/04-queue.md
  - ../chapters/05-memory.md
  - ../chapters/06-search.md
  - ../chapters/07-dictionary.md
  - ../chapters/08-tree.md
  - ../chapters/09-priority.md
  - ../chapters/10-set.md
  - ../chapters/11-mfset.md
  - ../chapters/12-sort.md
  - ../chapters/13-algorithm.md
  - ../chapters/14-graph.md
  - ../chapters/15-string.md
  - ../chapters/16-geometry.md
  - ../chapters/17-numeric.md
  - ../chapters/18-combinatorial.md
  - ../chapters/19-backtrack.md
  - ../chapters/20-complexity.md
  - ../chapters/21-compression.md
  - ../chapters/22-succinct.md
  - ../chapters/23-external.md
  - ../chapters/24-concurrent.md
  - ../chapters/25-parallel.md
  - ../chapters/26-distributed.md
  - ../chapters/A-writing-structure.md
  - ../chapters/B-benchmarks.md
  - ../chapters/C-libraries.md
  - ../chapters/Y-glossary.md
  - ../chapters/Z-bibliography.md

# Resolve ../figures/NAME.svg (rewritten to .pdf by the filter below).
resource-path:
  - .
  - ..
  - ../figures

filters:
  - snippets.lua
  - figure-ext.lua
  - crossref-link.lua
  - source-links.lua
  - break-code.lua
  - table-width.lua

pdf-engine: pdflatex

# The Markdown headings already carry manual numbers (for the web build);
# LaTeX auto-numbering is suppressed in preamble.tex to avoid duplication.
number-sections: false
toc: true
toc-depth: 2
top-level-division: chapter

include-in-header:
  - preamble.tex

metadata:
  title: "ADS: Algorithms and Data Structures, and Advanced ones"
  subtitle: "A User Manual"
  date: "Version 0.1.0 (November 2026)"
  author: "Donato Meoli"
  lang: en
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  documentclass: report
  papersize: a4
