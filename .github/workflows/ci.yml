###############################################################################
#                                 ci.yml                                      #
#                                                                             #
# Builds and tests ADS with CMake on Linux, macOS and Windows, and with the   #
# makefile on Linux and macOS; on Linux also with clang, under ASan and       #
# UBSan, BigInteger with its portable products and on the backend of GMP,     #
# FastHash and the vector quicksort on AVX2 (and AVX-512 when the runner has  #
# it), ConcurrentFlatTable on the compare-and-swap of 16 bytes, the queues    #
# between threads, the event count, the MultiQueue, the concurrent hash       #
# tables, the parallel operations of the trees by join, the parallel builds   #
# of the succinct structures and the stepping algorithms of the shortest      #
# paths under ThreadSanitizer, FlatHashTable on its broadword fallback and    #
# fft() on the lanes of AVX, on arrays of doubles and on the intrinsics of    #
# x86 that MSVC takes; it measures the coverage of the tests, run four at a   #
# time and with the cases there for their scale alone made smaller, and sends #
# it to Coveralls; it builds the C++20 module ads and runs the test that      #
# imports it, by CMake and Ninja with Clang and GCC 15 on Linux and the Clang #
# of LLVM on macOS, and by the makefile with clang++ and g++ 15.              #
###############################################################################

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a new push to a branch cancels the run still going on its previous commit,
# except on main, where every commit is tested: there each commit is a group
# of its own, since a group keeps one waiting run and cancels the others
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest , macos-latest , windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: CMake
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure
      - name: install and find_package
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/inst"
          test -f "$PWD/inst/include/ADS/sequence/List.h"
      - name: makefile
        if: runner.os != 'Windows'
        run: make test

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang
        run: make test CXX=clang++ BUILD=build-clang

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BigInteger with the products by halves of 32 bits
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Iinclude -Itest \
              -DADS_CONTRACTS=3 -DADS_BIGINT_PORTABLE -o portable \
              test/taocp.cpp -pthread
          for t in $(./portable -l | grep -E '^(big-integer|rational)'); do
            ./portable $t
          done

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ConcurrentFlatTable on the compare-and-swap of 16 bytes
        run: |
          g++ -std=c++20 -O2 -mcx16 -Iinclude -Itest -DADS_CONTRACTS=3 \
              -o cas16 test/engineered.cpp -pthread
          for t in concurrent-flat-table concurrent-flat-table-threads \
                   concurrent-flat-table-words; do
            ./cas16 $t
          done
      - name: FastHash on the stripes of AVX2, the same hashes as without
        run: |
          g++ -std=c++20 -O2 -march=x86-64-v3 -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o vectors test/hashing.cpp -pthread
          ./vectors fast-hash
      - name: vectorQuickSort() and sort() on AVX2, and on AVX-512 if there
        run: |
          march="x86-64-v3"
          grep -qw avx512f /proc/cpuinfo && march="$march x86-64-v4"
          for m in $march; do
            g++ -std=c++20 -O1 -g -fsanitize=address,undefined -march=$m \
                -Iinclude -Itest -DADS_CONTRACTS=3 -o sorts test/sorting.cpp
            for t in vector-quicksort dispatch dispatch-edges fast-paths; do
              ./sorts $t
            done
          done

  gmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: the tests with BigInteger on GMP, by the makefile
        run: make test ADS_WITH_GMP=1 BUILD=build-gmp
      - name: the same by CMake, installed and found by find_package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADS_WITH_GMP=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cmake --install build
          cmake -S packaging/test -B build-use \
                -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use
          ctest --test-dir build-use --output-on-failure

  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer on the queues between threads
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan spsc-queue
          ./tsan mpsc-inbox
      - name: ThreadSanitizer on the event count, with several notifiers
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq event-count
          ./tsanq event-count-notifiers
      - name: ThreadSanitizer on the MultiQueue and the concurrent tables
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq multi-queue-threads
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan concurrent-flat-table-threads
          ./tsan concurrent-cuckoo-threads
          g++ -std=c++20 -O1 -g -fsanitize=thread -mcx16 -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan16 test/engineered.cpp -pthread
          ./tsan16 concurrent-flat-table-words
      - name: ThreadSanitizer on the bulk operations of the trees by join
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-joins test/join_trees.cpp -pthread
          ./tsan-joins join-executors
          ./tsan-joins interval-tree
          ./tsan-joins range-tree
      - name: ThreadSanitizer on the deterministic reservations
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-spec test/engineered_speculative.cpp \
              -pthread
          for t in $(./tsan-spec -l); do ./tsan-spec $t; done
      - name: ThreadSanitizer on the parallel builds and the stepping
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-par test/engineered_parallel.cpp \
              -pthread
          ./tsan-par parallel-rank-select
          ./tsan-par parallel-wavelet-matrix
          ./tsan-par parallel-huffman-wavelet-tree
          ./tsan-par parallel-stepping

  broadword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FlatHashTable on SWAR instead of SSE2, under ASan and UBSan
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
              -Iinclude -Itest -DADS_CONTRACTS=3 -DADS_FLAT_SIMD=0 \
              -o swar test/engineered.cpp -pthread
          ./swar flat-hash-table

  fft:
    # the paths of fft() at -O2 with the contracts and without the
    # sanitizers, whose instrumentation of the unrolled codelets needs more
    # memory than the runner has on these lanes (the default ones are under
    # ASan and UBSan in sanitizers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: [ -DADS_FFT_SIMD=0 , -mavx2 , -DADS_FFT_INTRINSICS=1 ,
                 -mavx2 -DADS_FFT_INTRINSICS=1 , -mavx2 -DADS_FFT_LEAN=1 ]
    steps:
      - uses: actions/checkout@v4
      - name: fft() and the transforms of fft.cpp on ${{ matrix.flags }}
        run: |
          for f in taocp fft; do
            g++ -std=c++20 -O2 -Iinclude -Itest -DADS_CONTRACTS=3 \
                ${{ matrix.flags }} -o $f test/$f.cpp -pthread
          done
          for t in fft fft-sizes fft-large fft-lanes convolve-real; do
            ./taocp $t
          done
          for t in $(./fft -l); do ./fft $t; done

  coverage:
    # the programs built and the tests run four at a time, the longest
    # tests first (gcov merges the counters of the processes of one program
    # under a lock), the cases there for their scale alone made smaller by
    # ADS_TEST_SMALL [see ADSTest.h]; the list against the programs is
    # checked by the other jobs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: the tests with the coverage of gcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          make -j4 BUILD=build-cov CXXFLAGS="-std=c++20 -O0 -g --coverage \
               -Wall -Wextra -DADS_TEST_SMALL"
          awk '/^[a-z]/{print $1, $2}' test/tests.txt > tests
          grep -E ' (big-integer-(pool|gmp)|.*parallel-sort)$' tests > first
          { cat first; grep -vxFf first tests; } |
            xargs -P 4 -n 2 sh -c 'build-cov/$0 $1'
          lcov --capture --directory build-cov --output-file lcov.info \
               --ignore-errors mismatch,inconsistent,unused
          lcov --extract lcov.info "$PWD/include/*" \
               --output-file lcov.info --ignore-errors unused
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          fail-on-error: false

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          SAN: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: make test CXXFLAGS="-std=c++20 -O1 -g $SAN -Wall -Wextra"

  # the module by CMake: a build where it was turned off fails, as does one
  # where ctest finds no test module; GCC 15, which the runners lack, from
  # its image
  module-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest , cxx: clang++ }
          - { os: ubuntu-latest , cxx: g++ , image: "gcc:15" }
          - { os: macos-latest , cxx: llvm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Ninja and clang-scan-deps
        if: runner.os == 'Linux' && !matrix.image
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tools
      - name: CMake and Ninja in the image of GCC
        if: matrix.image
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
      - name: Ninja and LLVM
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          llvm=$(brew --prefix llvm)
          echo "CXX=$llvm/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L$llvm/lib/c++ -Wl,-rpath,$llvm/lib/c++" \
               >> $GITHUB_ENV
      - name: the compiler
        if: runner.os == 'Linux'
        run: echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DADS_BUILD_MODULE=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst" 2>&1 | tee cmake.log
          ! grep -q 'ADS_BUILD_MODULE is turned OFF' cmake.log
          cmake --build build --target module
          ctest --test-dir build -R '^module$' --no-tests=error \
                --output-on-failure
      - name: installed and imported through find_package
        shell: bash
        run: |
          cmake --install build
          test -f inst/include/ADS/modules/ADS.cppm
          cmake -S packaging/test -B build-use -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use --target use-module
          ctest --test-dir build-use -R '^use-module$' --no-tests=error \
                --output-on-failure

  # the module by the makefile: make builds build-make/module only with the
  # module, the rule of the other tests failing on its import
  module-make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: clang++ }
          - { cxx: g++ , image: "gcc:15" }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          make ADSMOD=1 CXX=${{ matrix.cxx }} build-make/module 2>&1 \
               | tee make.log
          ! grep -q 'ADSMOD is turned off' make.log
          build-make/module
