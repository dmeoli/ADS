###############################################################################
#                                 ci.yml                                      #
#                                                                             #
# Builds and tests ADS by CMake and by the makefiles [see lib/makefile-c],    #
# with g++ and with clang++, on Linux, on macOS (the clang++ of Xcode and the #
# g++ of Homebrew) and on Windows (the g++ and the clang++ of MinGW-w64 in    #
# MSYS2, and MSVC by CMake alone), and installs it for a project that finds   #
# it by find_package and by pkg-config, everywhere both on the backends of    #
# GMP and of a CBLAS found (OpenBLAS, Accelerate) and on the code of ADS      #
# alone; on Linux it also runs the tests under ASan and UBSan, BigInteger     #
# with its portable products, the backends required, with the parallel gemm() #
# on OpenBLAS under ThreadSanitizer, the executors of OpenMP, oneTBB and      #
# FastFlow by the makefile, with the long-lived workers, their channels, the  #
# farm and the mailbox, and the order of the includes of FastFlowExecutor.h,  #
# the sort and the runtime over the processes of Open MPI and of MPICH,       #
# FastHash and the vector quicksort on AVX2 (and AVX-512 when the runner has  #
# it), ConcurrentFlatTable on the compare-and-swap of 16 bytes, the queues    #
# between threads, the event count, the MultiQueue, the stealable priority    #
# queue, the priority queue without locks, the concurrent hash tables, the    #
# parallel operations of the trees by join, the parallel builds of the        #
# succinct structures, the stepping algorithms of the shortest paths and the  #
# runtime of the workers under ThreadSanitizer, FlatHashTable on its          #
# broadword fallback, the executors on the runtimes of a program (oneTBB on   #
# the arenas of the program, OpenMP inside a region, the parallel algorithms  #
# of the standard library, stdexec, Taskflow and Kokkos) under the parallel   #
# tests, and two units built with different flags linked into one program; on #
# ARM64 it runs the tests on Linux and, not yet required, on Windows with     #
# MSVC, and ThreadSanitizer on the concurrent structures, and on s390x,       #
# big-endian, by QEMU and not yet required, the structures with branches for  #
# the order of the bytes; it measures the coverage of the tests, run four at  #
# a time and with the cases there for their scale alone made smaller, and     #
# sends it to Coveralls; it builds the C++20 module ads and runs the test     #
# that imports it, by CMake and Ninja with Clang and GCC 15 on Linux and the  #
# Clang of LLVM on macOS, and by the makefile with clang++ and g++ 15. On a   #
# pull request, the lines that it changes are checked in the style of the     #
# repository code-style, whose action posts the changes that put them there   #
# as suggestions on them; on every push, all the C++ sources and the theory   #
# pages are checked whole, since the whole tree is in the style.              #
# The adapters of the other libraries of include/ADS/interop (cereal, Eigen,  #
# METIS, KaHIP, SuiteSparse:GraphBLAS, NetworKit, CRoaring, sdsl-lite 3 and   #
# nanoarrow) are tested on Linux, macOS and MSYS2 with the libraries that the #
# package manager of the runner has, or that are small enough to be built     #
# from their sources, and with all of them in the job interop, by CMake and   #
# by the makefile; the wheel of the package of Python is built and its tests  #
# run on Linux, macOS and Windows.                                            #
###############################################################################

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a new push to a branch cancels the run still going on its previous commit,
# except on main, where every commit is tested: there each commit is a group
# of its own, since a group keeps one waiting run and cancels the others
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # the lines that a pull request changes, in the style of the repository
  # code-style, with the changes that put them there posted as suggestions
  style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dmeoli/code-style@v1

  # every C++ source, header and theory page in the style, by format.py of
  # code-style (the version of its tag v1) with the .clang-format at the
  # root, which is that of code-style
  style-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dmeoli/code-style
          ref: v1
          path: .code-style
      - name: Install clang-format
        run: pip install -q "clang-format==22.1.5"
      - name: Check the style of every file
        run: |
          git ls-files '*.h' '*.tpp' '*.cpp' '*.cppm' '*.dox' ':!manual' |
            xargs -P 4 -n 20 python3 .code-style/format.py --check |
            tee style.txt
          test ! -s style.txt

  # the set of every header given in cmake/ads_sets.txt, and the entry
  # points, the table of the README and the modules up to date with it, so
  # that a new header with no set fails here [see cmake/ads_sets.py]
  sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the sets of the headers
        run: python3 cmake/ads_sets.py --check

  # every program built and every test run by CMake and by the makefiles,
  # four at a time, and the installed package used through find_package and
  # pkg-config [see packaging/test]; on Windows, MSVC by CMake alone and the
  # compilers of MSYS2, whose bash runs the makefiles; GMP and a CBLAS are
  # installed where the runner lacks them, the default builds must find
  # them (but the CBLAS on MSYS2 and with the g++ of macOS, and both with
  # MSVC), and the makefiles run the tests again with both off; the
  # libraries of the adapters of include/ADS/interop are installed from the
  # package manager of the runner, or else built from their sources by
  # .github/interop-libs.sh (and kept in the cache), and those in ADS_LIBS
  # are required, with nanoarrow, by CMake and by the makefiles: on Linux,
  # cereal, Eigen, METIS, CRoaring, sdsl-lite and nanoarrow (KaHIP,
  # GraphBLAS 10 and NetworKit, which apt lacks or has too old, in the job
  # interop); on macOS all of them from Homebrew, but sdsl-lite, though not
  # KaHIP and NetworKit with g++, whose libraries are built on libc++; on
  # MSYS2 all but KaHIP and NetworKit, which it lacks; none with MSVC, for
  # which vcpkg would build them all at each run
  test:
    name: test (${{ matrix.os }}, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest , compiler: g++ , cxx: g++ }
          - { os: ubuntu-latest , compiler: clang++ , cxx: clang++ }
          - { os: macos-latest , compiler: clang++ , cxx: clang++ }
          - { os: macos-latest , compiler: g++ , cxx: g++-15 }
          - { os: windows-latest , compiler: msvc }
          - { os: windows-latest , compiler: g++ , cxx: g++ ,
              msystem: UCRT64 , cc: gcc }
          - { os: windows-latest , compiler: clang++ , cxx: clang++ ,
              msystem: CLANG64 , cc: clang }
          # ARM64: Linux (the NEON matching of the hash tables) and, not yet
          # required, Windows with MSVC (the branches of _M_ARM64)
          - { os: ubuntu-24.04-arm , compiler: g++ , cxx: g++ }
          - { os: windows-11-arm , compiler: msvc , experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.msystem && 'msys2 {0}' || 'bash' }}
    env:
      CXX: ${{ matrix.cxx }}
      GEN: ${{ matrix.msystem && '-G Ninja' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: the compiler, CMake, Ninja and make of MSYS2
        if: matrix.msystem
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make git
          pacboy: >-
            ${{ matrix.cc }}:p cmake:p ninja:p pkgconf:p gmp:p eigen3:p
            metis:p suitesparse:p cereal:p nanoarrow:p
      - name: the g++ of Homebrew
        if: runner.os == 'macOS' && matrix.compiler == 'g++'
        run: command -v "$CXX" || brew install gcc@15
      - name: GMP, OpenBLAS and the libraries of the adapters
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libopenblas-dev \
              libeigen3-dev libmetis-dev libcereal-dev
      - name: GMP and the libraries of the adapters, of Homebrew
        if: runner.os == 'macOS'
        run: |
          brew install gmp eigen metis suite-sparse croaring cereal \
              nanoarrow libnetworkit kahip
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: the libraries of the adapters required, and their prefix
        if: matrix.compiler != 'msvc'
        run: |
          opt="$RUNNER_TEMP/interop"
          if command -v cygpath > /dev/null; then
            opt=$(cygpath -m "$opt")
          fi
          libs="CEREAL EIGEN METIS GRAPHBLAS CROARING SDSL"
          case "$RUNNER_OS-${{ matrix.compiler }}" in
            Linux-*) libs="CEREAL EIGEN METIS CROARING SDSL"
                     src="sdsl croaring nanoarrow" ;;
            macOS-clang++) libs="$libs KAHIP NETWORKIT" src=sdsl ;;
            macOS-*) src=sdsl ;;
            *) src="sdsl croaring" ;;
          esac
          { echo "OPT=$opt"; echo "ADS_LIBS=$libs"; echo "ADS_SRC=$src"; } \
            >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: matrix.compiler != 'msvc'
        with:
          path: ${{ runner.temp }}/interop
          key: >-
            interop-${{ matrix.os }}-${{ matrix.compiler }}-${{
            hashFiles('.github/interop-libs.sh') }}
      - name: the libraries of the adapters, from their sources
        if: matrix.compiler != 'msvc'
        run: |
          if [ -n "${{ matrix.msystem }}" ]; then
            export CMAKE_GENERATOR=Ninja
          fi
          .github/interop-libs.sh "$OPT" $ADS_SRC
      - name: CMake
        run: |
          inst="$PWD/inst"
          if command -v cygpath > /dev/null; then
            inst=$(cygpath -m "$inst")
          fi
          echo "INST=$inst" >> "$GITHUB_ENV"
          set -o pipefail
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$inst" -DCMAKE_PREFIX_PATH="$OPT" \
                $(for l in $ADS_LIBS; do echo "-DADS_WITH_$l=ON"; done) |
            tee cmake.log
          if [ "${{ matrix.compiler }}" != msvc ]; then
            grep -q 'ADS: GMP ON' cmake.log
            grep -q 'ADS: nanoarrow ON' cmake.log
          fi
          if [ -z "${{ matrix.msystem }}" ] &&
             [ "${{ matrix.compiler }}" != msvc ] &&
             [ "$RUNNER_OS-${{ matrix.compiler }}" != macOS-g++ ]; then
            grep -q 'CBLAS ON' cmake.log
          fi
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --parallel 4 --output-on-failure
      - name: installed, and found by find_package and pkg-config
        run: |
          cmake --install build --config Release
          test -f "$INST/include/ADS/ADSConfig.h"
          cmake -S packaging/test -B build-use $GEN \
                -DCMAKE_PREFIX_PATH="$INST"
          cmake --build build-use --config Release
          ctest --test-dir build-use -C Release --output-on-failure
      - name: makefile, on the backends found and with them off
        if: matrix.compiler != 'msvc'
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          roots="CRoaring_ROOT=$OPT sdsl_ROOT=$OPT nanoarrow_ROOT=$OPT"
          [ "$RUNNER_OS" = macOS ] && roots="sdsl_ROOT=$OPT"
          on=$(for l in $ADS_LIBS NANOARROW; do echo "ADS_WITH_$l=1"; done)
          make backends $roots $on
          make -j4 test $roots $on
          make -j4 test ADS_WITH_GMP=0 ADS_WITH_BLAS=0 ADS_WITH_BOOST=0 \
               ADS_WITH_LEMON=0 BUILD=build-off

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BigInteger with the products by halves of 32 bits
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Iinclude -Itest \
              -DADS_CONTRACTS=3 -DADS_BIGINT_PORTABLE -o portable \
              test/taocp.cpp -pthread
          for t in $(./portable -l | grep -E '^(big-integer|rational)'); do
            ./portable $t
          done

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ConcurrentFlatTable on the compare-and-swap of 16 bytes
        run: |
          g++ -std=c++20 -O2 -mcx16 -Iinclude -Itest -DADS_CONTRACTS=3 \
              -o cas16 test/engineered.cpp -pthread
          for t in concurrent-flat-table concurrent-flat-table-threads \
                   concurrent-flat-table-words; do
            ./cas16 $t
          done
      - name: FastHash on the stripes of AVX2, the same hashes as without
        run: |
          g++ -std=c++20 -O2 -march=x86-64-v3 -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o vectors test/hashing.cpp -pthread
          ./vectors fast-hash
      - name: two units on SSE2 and on AVX2 with the CAS of 16 bytes, linked
        run: |
          for u in A B; do
            flags="-DADS_FLAT_SIMD=0 -DADS_FLAT_CAS16=0"
            [ $u = B ] && flags="-march=x86-64-v3 -mcx16"
            g++ -std=c++20 -O2 -Wall -Wextra -Iinclude -DADS_CONTRACTS=3 \
                -DADS_ABI_UNIT=$u $flags -c -o abi_$u.o test/abi_unit.cpp
          done
          g++ -std=c++20 -O2 -o abi test/abi_units.cpp abi_A.o abi_B.o -pthread
          ./abi
      - name: vectorQuickSort() and sort() on AVX2, and on AVX-512 if there
        run: |
          march="x86-64-v3"
          grep -qw avx512f /proc/cpuinfo && march="$march x86-64-v4"
          for m in $march; do
            g++ -std=c++20 -O1 -g -fsanitize=address,undefined -march=$m \
                -DADS_SANITIZE_ADDRESS \
                -Iinclude -Itest -DADS_CONTRACTS=3 -o sorts test/sorting.cpp
            for t in vector-quicksort dispatch dispatch-edges fast-paths; do
              ./sorts $t
            done
          done

  # the backends required (GMP, OpenBLAS and the headers of Boost), by the
  # makefile and by CMake, the installed package found again, and the
  # parallel gemm() on OpenBLAS under ThreadSanitizer
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP, OpenBLAS and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libopenblas-dev libboost-dev
      - name: the tests on GMP, OpenBLAS and Boost, by the makefile
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          make -j4 test ADS_WITH_GMP=1 ADS_WITH_BLAS=1 ADS_WITH_BOOST=1 \
               BUILD=build-on
      - name: the same by CMake, installed and found by find_package
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADS_WITH_GMP=ON \
                -DADS_WITH_BLAS=ON -DADS_WITH_BOOST=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst"
          cmake --build build --parallel 4
          ctest --test-dir build --parallel 4 --output-on-failure
          cmake --install build
          cmake -S packaging/test -B build-use \
                -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use
          ctest --test-dir build-use --output-on-failure
      - name: the parallel gemm() on OpenBLAS under ThreadSanitizer
        env:
          OPENBLAS_NUM_THREADS: 1
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -DADS_WITH_BLAS -o tsan-blas \
              test/engineered_parallel.cpp -pthread -lopenblas
          ./tsan-blas parallel-numeric
      - name: CMake with the three off
        run: |
          set -o pipefail
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release \
                -DADS_WITH_GMP=OFF -DADS_WITH_BLAS=OFF \
                -DADS_WITH_BOOST=OFF | tee cmake.log
          grep -q 'ADS: GMP OFF, CBLAS OFF' cmake.log
          grep -q 'ADS: Boost OFF' cmake.log
          cmake --build build-off --parallel 4
          ctest --test-dir build-off --parallel 4 --output-on-failure

  executors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: oneTBB and FastFlow
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev
          git clone --quiet --depth 1 \
              https://github.com/fastflow/fastflow.git "$RUNNER_TEMP/ff"
      - name: the tests of the executors, by the makefile
        run: |
          make -j4 BUILD=build-exec ADS_WITH_OPENMP=1 ADS_WITH_TBB=1 \
               ADS_WITH_FASTFLOW=1 FastFlow_ROOT="$RUNNER_TEMP/ff" \
               build-exec/engineered_parallel \
               build-exec/engineered_speculative \
               build-exec/engineered_runtime test-fastflow-order
          for p in engineered_parallel engineered_speculative \
                   engineered_runtime; do
            for t in $(build-exec/$p -l); do build-exec/$p $t; done
          done

  # the concurrent structures and the parallel algorithms under
  # ThreadSanitizer, on x86-64 and on ARM64, whose weaker order of the
  # memory shows an acquire or a release that is missing, where the total
  # store order of x86-64 hides it
  threads:
    name: threads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest , ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer on the queues between threads
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan spsc-queue
          ./tsan mpsc-inbox
      - name: ThreadSanitizer on the event count, with several notifiers
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq event-count
          ./tsanq event-count-notifiers
      - name: ThreadSanitizer on the priority queues and the concurrent tables
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq multi-queue-threads
          ./tsanq stealable-pq
          ./tsanq stealable-pq-threads
          ./tsanq stealable-pq-bound
          ./tsanq stealable-pq-bound-threads
          ./tsanq lockfree-pq-threads
          ./tsanq lockfree-pq-linearizable
          ./tsanq min-board-threads
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan concurrent-flat-table-threads
          ./tsan concurrent-flat-table-find-key
          ./tsan single-writer-flat-table-threads
          ./tsan concurrent-cuckoo-threads
          if [ "$(uname -m)" = x86_64 ]; then
            g++ -std=c++20 -O1 -g -fsanitize=thread -mcx16 -Iinclude \
                -DADS_SANITIZE_THREAD \
                -Itest -DADS_CONTRACTS=3 -o tsan16 test/engineered.cpp \
                -pthread
            ./tsan16 concurrent-flat-table-words
          fi
      - name: ThreadSanitizer on the backoff and the packed arrays
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -DADS_TEST_SMALL -o tsan-search \
              test/engineered_search.cpp -pthread
          for t in backoff-threads packed-array trit-array affinity; do
            ./tsan-search $t
          done
      - name: ThreadSanitizer on the bulk operations of the trees by join
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan-joins test/join_trees.cpp -pthread
          ./tsan-joins join-executors
          ./tsan-joins interval-tree
          ./tsan-joins range-tree
      - name: ThreadSanitizer on the deterministic reservations
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan-spec test/engineered_speculative.cpp \
              -pthread
          for t in $(./tsan-spec -l); do ./tsan-spec $t; done
      - name: ThreadSanitizer on the parallel builds and the stepping
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan-par test/engineered_parallel.cpp \
              -pthread
          ./tsan-par parallel-rank-select
          ./tsan-par parallel-wavelet-matrix
          ./tsan-par parallel-huffman-wavelet-tree
          ./tsan-par parallel-stepping
      - name: ThreadSanitizer on the workers, the channels and the mailbox
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -o tsan-rt test/engineered_runtime.cpp \
              -pthread
          for t in $(./tsan-rt -l); do ./tsan-rt $t; done

  # the sort and the runtime over the processes of MPI on 1 to 4 processes,
  # by the makefile and by CMake, on Open MPI (with a program of Boost.MPI
  # too) and on MPICH; MPI is off by default, so that the other jobs build
  # ADS without it
  mpi:
    name: mpi (${{ matrix.mpi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mpi: openmpi , packages: libopenmpi-dev openmpi-bin
                libboost-mpi-dev libboost-serialization-dev ,
              preflags: --oversubscribe , boost: true }
          - { mpi: mpich , packages: libmpich-dev mpich , preflags: "" }
    runs-on: ubuntu-latest
    # the runners have no InfiniBand: UCX on its shared memory and TCP alone,
    # since its probe of the verbs makes MPI_Init fail on some of them
    env:
      UCX_TLS: self,sm,tcp
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.mpi }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: the tests over MPI, by the makefile
        run: |
          make backends ADS_WITH_MPI=auto | tee backends.log
          grep -q 'ADS: MPI ON' backends.log
          make test-mpi BUILD=build-mpi ADS_WITH_MPI=auto
      - name: the same in a program of Boost.MPI, by the makefile
        if: matrix.boost
        run: make test-boost-mpi BUILD=build-mpi ADS_WITH_MPI=auto
      - name: the same by CMake, MPI required
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADS_WITH_MPI=ON \
                -DMPIEXEC_PREFLAGS="${{ matrix.preflags }}" | tee cmake.log
          grep -q 'ADS: MPI ON' cmake.log
          targets="engineered_mpi interop_examples_mpi"
          if [ "${{ matrix.boost }}" = true ]; then
            grep -q 'runtimes of the program found:.*BoostMPI' cmake.log
            targets="$targets engineered_boost_mpi"
          fi
          cmake --build build --parallel 4 --target $targets
          ctest --test-dir build \
                -R '^(engineered_(boost_)?mpi|interop_examples_mpi)[.]' \
                --output-on-failure

  # the executors on the runtimes of a program, required: oneTBB on the
  # arenas of the program, OpenMP inside a region, the parallel algorithms of
  # the standard library (libstdc++ on oneTBB), the senders of stdexec,
  # Taskflow and Kokkos (built on its backend of OpenMP), under the parallel
  # tests of the library and in their own, by CMake, with the components
  # found again by an installed package; the senders and Taskflow also under
  # ThreadSanitizer (OpenMP and oneTBB are not instrumented); the examples of
  # appendix C of the manual on all of them, with Boost, GMP, OpenBLAS and
  # abLEMON besides; and the adapters of all the other libraries of
  # include/ADS/interop, required, by CMake and by the makefile: cereal,
  # Eigen and METIS of apt, sdsl-lite 3, CRoaring, nanoarrow, GraphBLAS 10,
  # KaHIP and NetworKit built from their sources by .github/interop-libs.sh
  # (and kept in the cache)
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STDEXEC_COMMIT: 2513475
      TASKFLOW_COMMIT: 9d9cea0
      KOKKOS_TAG: 4.7.01
    steps:
      - uses: actions/checkout@v4
      - name: oneTBB, stdexec, Taskflow and Kokkos
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev ninja-build libboost-dev \
              libgmp-dev libopenblas-dev libeigen3-dev libmetis-dev \
              libcereal-dev
          git clone --quiet --depth 1 https://github.com/dmeoli/abLEMON.git \
              "$RUNNER_TEMP/ablemon"
          cmake -S "$RUNNER_TEMP/ablemon" -B "$RUNNER_TEMP/ablemon-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ablemon-inst"
          cmake --build "$RUNNER_TEMP/ablemon-build"
          cmake --install "$RUNNER_TEMP/ablemon-build"
          for r in NVIDIA/stdexec:$STDEXEC_COMMIT \
                   taskflow/taskflow:$TASKFLOW_COMMIT; do
            d="$RUNNER_TEMP/${r%%/*}"
            git clone --quiet "https://github.com/${r%%:*}.git" "$d"
            git -C "$d" checkout --quiet "${r##*:}"
          done
          git clone --quiet --depth 1 --branch "$KOKKOS_TAG" \
              https://github.com/kokkos/kokkos.git "$RUNNER_TEMP/kokkos"
          cmake -S "$RUNNER_TEMP/kokkos" -B "$RUNNER_TEMP/kokkos-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=20 -DKokkos_ENABLE_OPENMP=ON \
                -DKokkos_ENABLE_SERIAL=ON \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kokkos-inst"
          cmake --build "$RUNNER_TEMP/kokkos-build"
          cmake --install "$RUNNER_TEMP/kokkos-build"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/interop
          key: >-
            interop-${{ runner.os }}-all-${{
            hashFiles('.github/interop-libs.sh') }}
      - name: the libraries of the adapters, from their sources
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          .github/interop-libs.sh "$RUNNER_TEMP/interop" sdsl croaring \
              nanoarrow graphblas kahip networkit
      - name: the executors under the parallel tests, by CMake
        run: |
          set -o pipefail
          prefixes="$RUNNER_TEMP/kokkos-inst;$RUNNER_TEMP/interop"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DADS_WITH_TBB=ON -DADS_WITH_OPENMP=ON \
                -DADS_WITH_STDPAR=ON -DADS_WITH_STDEXEC=ON \
                -DADS_WITH_TASKFLOW=ON -DADS_WITH_KOKKOS=ON \
                -DADS_WITH_BOOST=ON -DADS_WITH_GMP=ON -DADS_WITH_BLAS=ON \
                -DADS_WITH_LEMON=ON -DLEMON_ROOT="$RUNNER_TEMP/ablemon-inst" \
                -DSTDEXEC_INCLUDE_DIR="$RUNNER_TEMP/NVIDIA/include" \
                -DTaskflow_INCLUDE_DIR="$RUNNER_TEMP/taskflow" \
                -DCMAKE_PREFIX_PATH="$prefixes" \
                -DADS_WITH_CEREAL=ON -DADS_WITH_EIGEN=ON -DADS_WITH_METIS=ON \
                -DADS_WITH_KAHIP=ON -DADS_WITH_GRAPHBLAS=ON \
                -DADS_WITH_NETWORKIT=ON -DADS_WITH_CROARING=ON \
                -DADS_WITH_SDSL=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst" | tee cmake.log
          grep -q 'found: StdPar;stdexec;Taskflow;Kokkos' cmake.log
          grep -q 'ADS: nanoarrow ON' cmake.log
          cmake --build build --target engineered_parallel \
                engineered_speculative interop_parallel interop_examples \
                interop_graphs interop_columnar engineered_persistence \
                abi_units
          tests='^(engineered_parallel|engineered_speculative'
          tests="$tests|interop_parallel|interop_examples|interop_graphs"
          tests="$tests|interop_columnar|engineered_persistence)[.]"
          tests="$tests|^abi-units$"
          ctest --test-dir build --output-on-failure -R "$tests"
          cmake --install build
          grep -q 'Taskflow;Kokkos' inst/share/cmake/ADS/ADSConfig.cmake
          grep -q 'GraphBLAS;NetworKit;CRoaring;sdsl' \
               inst/share/cmake/ADS/ADSConfig.cmake
      - name: the adapters of the libraries, by the makefile
        run: |
          opt="$RUNNER_TEMP/interop"
          make -j4 BUILD=build-interop CRoaring_ROOT="$opt" \
               sdsl_ROOT="$opt" nanoarrow_ROOT="$opt" KaHIP_ROOT="$opt" \
               GraphBLAS_ROOT="$opt" NetworKit_ROOT="$opt" tlx_ROOT="$opt" \
               ADS_WITH_CEREAL=1 ADS_WITH_CROARING=1 ADS_WITH_SDSL=1 \
               ADS_WITH_NANOARROW=1 ADS_WITH_EIGEN=1 ADS_WITH_METIS=1 \
               ADS_WITH_KAHIP=1 ADS_WITH_GRAPHBLAS=1 ADS_WITH_NETWORKIT=1 \
               test-interop_graphs test-interop_columnar \
               test-interop_examples test-engineered_persistence
          failed=$(cat build-interop/interop_graphs.failed \
                   build-interop/interop_columnar.failed \
                   build-interop/interop_examples.failed \
                   build-interop/engineered_persistence.failed |
                   awk '{ s += $1 } END { print s + 0 }')
          test "$failed" -eq 0
      - name: the senders and Taskflow under ThreadSanitizer
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_SANITIZE_THREAD \
              -DADS_CONTRACTS=3 -DADS_WITH_STDEXEC -DADS_WITH_TASKFLOW \
              -isystem "$RUNNER_TEMP/NVIDIA/include" \
              -isystem "$RUNNER_TEMP/taskflow" -o tsan-interop \
              test/interop_parallel.cpp -pthread -ltbb
          ./tsan-interop sender-executor
          ./tsan-interop taskflow-executor

  # the package of Python: the wheel built by pip from python/ (one wheel on
  # the stable ABI of Python 3.12, on scikit-build-core and nanobind),
  # installed with the libraries of its tests, and its tests of pytest, the
  # backend nx-ads of NetworkX among them, and the examples of the manual run
  # on it; on Linux also the package built by CMake (ADS_WITH_PYTHON=ON) and
  # its ctests python.*
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest , macos-latest , windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the wheel, installed, and its tests
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel ./python --no-deps -w dist
          python -m pip install dist/ads_python-*.whl
          python -m pip install pytest networkx scipy pyroaring
          python -m pytest -q -p no:cacheprovider python/tests
          python python/examples/structures.py
          python python/examples/networkx_backend.py
      - name: the package by CMake, and its ctests
        if: runner.os == 'Linux'
        run: |
          python -m pip uninstall -y ads-python
          python -m pip install nanobind
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DADS_WITH_PYTHON=ON \
                -DPython_EXECUTABLE="$(command -v python)" | tee cmake.log
          grep -q 'ADS: Python ON' cmake.log
          cmake --build build --parallel 4 --target _core _core_stub \
                ads_python_files
          ctest --test-dir build -R '^python[.]' --no-tests=error \
                --output-on-failure

  # a big-endian target, s390x: the programs of the structures with
  # branches for the order of the bytes (the hash tables, the searches of
  # strings, the packings of integers, the hashes), built by the cross
  # compiler of Ubuntu and run by the emulator of QEMU; not yet required
  bigendian:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: the cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-s390x-linux-gnu qemu-user
      - name: the tests with branches for the order of the bytes
        env:
          QEMU_LD_PREFIX: /usr/s390x-linux-gnu
        run: |
          for p in engineered:flat-hash-table \
                   engineered_strings:string-search,aho-corasick,multi-search \
                   engineered_succinct:binary-packing,stream-vbyte \
                   hashing:fast-hash; do
            prog=${p%%:*}
            s390x-linux-gnu-g++ -std=c++20 -O2 -Iinclude -Itest \
                -DADS_CONTRACTS=3 -DADS_TEST_SMALL -o be-$prog \
                test/$prog.cpp -pthread
            for t in $(echo ${p##*:} | tr , ' '); do
              qemu-s390x ./be-$prog $t
            done
          done

  broadword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FlatHashTable on SWAR instead of SSE2, under ASan and UBSan
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
              -DADS_SANITIZE_ADDRESS \
              -Iinclude -Itest -DADS_CONTRACTS=3 -DADS_FLAT_SIMD=0 \
              -o swar test/engineered.cpp -pthread
          ./swar flat-hash-table

  coverage:
    # the programs dealt in turn to three jobs, each building its own and
    # running their tests four at a time, the longest tests first (gcov
    # merges the counters of the processes of one program under a lock),
    # the cases there for their scale alone made smaller by ADS_TEST_SMALL
    # [see ADSTest.h]; Coveralls merges the three reports; the list against
    # the programs is checked by the other jobs
    name: coverage (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0 , 1 , 2 ]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: the tests with the coverage of gcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          awk '/^[a-z]/{print $1}' test/tests.txt | sort -u |
            awk '( NR - 1 ) % 3 == ${{ matrix.shard }}' > programs
          make -j4 BUILD=build-cov CXXFLAGS="-std=c++20 -O0 -g --coverage \
               -Wall -Wextra -DADS_TEST_SMALL" \
               $(sed 's|^|build-cov/|' programs)
          awk 'NR == FNR { p[ $1 ] ; next } /^[a-z]/ && ( $1 in p ) {
                 print $1, $2 }' programs test/tests.txt > tests
          grep -E ' (big-integer-gmp|.*parallel-sort)$' tests > first || true
          { cat first; grep -vxFf first tests; } |
            xargs -P 4 -n 2 sh -c 'build-cov/$0 $1'
          lcov --capture --directory build-cov --output-file lcov.info \
               --ignore-errors mismatch,inconsistent,unused
          lcov --extract lcov.info "$PWD/include/*" \
               --output-file lcov.info \
               --ignore-errors inconsistent,unused
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          flag-name: shard-${{ matrix.shard }}
          parallel: true
          fail-on-error: false

  coverage-done:
    # the three reports of the coverage closed into one build of Coveralls
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false

  sanitizers:
    # the programs built and run four at a time, the cases there for their
    # scale alone made smaller by ADS_TEST_SMALL [see ADSTest.h]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          SAN: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          make -j4 test \
               CXXFLAGS="-std=c++20 -O1 -g $SAN -Wall -Wextra -DADS_TEST_SMALL"

  # the module by CMake: a build where it was turned off fails, as does one
  # where ctest finds no test module; GCC 15, which the runners lack, from
  # its image
  module-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest , cxx: clang++ }
          - { os: ubuntu-latest , cxx: g++ , image: "gcc:15" }
          - { os: macos-latest , cxx: llvm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Ninja and clang-scan-deps
        if: runner.os == 'Linux' && !matrix.image
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tools
      - name: CMake and Ninja in the image of GCC
        if: matrix.image
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
      - name: Ninja and LLVM
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          llvm=$(brew --prefix llvm)
          echo "CXX=$llvm/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L$llvm/lib/c++ -Wl,-rpath,$llvm/lib/c++" \
               >> $GITHUB_ENV
      - name: the compiler
        if: runner.os == 'Linux'
        run: echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DADS_BUILD_MODULE=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst" 2>&1 | tee cmake.log
          ! grep -q 'ADS_BUILD_MODULE is turned OFF' cmake.log
          cmake --build build --target module module_core module_base \
                module_advanced
          ctest --test-dir build -R '^module' --no-tests=error \
                --output-on-failure
      - name: installed and imported through find_package
        shell: bash
        run: |
          cmake --install build
          for f in ADS ADSCore ADSBase ADSAdvanced; do
            test -f inst/include/ADS/modules/$f.cppm
          done
          cmake -S packaging/test -B build-use -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use --target use-module
          ctest --test-dir build-use -R '^use-module$' --no-tests=error \
                --output-on-failure

  # the module by the makefile: make builds build-make/module only with the
  # module, the rule of the other tests failing on its import
  module-make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: clang++ }
          - { cxx: g++ , image: "gcc:15" }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          make ADSMOD=1 CXX=${{ matrix.cxx }} build-make/module \
               build-make/module_core build-make/module_base \
               build-make/module_advanced 2>&1 | tee make.log
          ! grep -q 'ADSMOD is turned off' make.log
          for m in module module_core module_base module_advanced; do
            build-make/$m
          done
