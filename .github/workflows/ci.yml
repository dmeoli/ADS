###############################################################################
#                                 ci.yml                                      #
#                                                                             #
# Builds and tests ADS by CMake and by the makefiles [see lib/makefile-c],    #
# with g++ and with clang++, on Linux, on macOS (the clang++ of Xcode and the #
# g++ of Homebrew) and on Windows (the g++ and the clang++ of MinGW-w64 in    #
# MSYS2, and MSVC by CMake alone), and installs it for a project that finds   #
# it by find_package and by pkg-config, everywhere both on the backends of    #
# GMP and of a CBLAS found (OpenBLAS, Accelerate) and on the code of ADS      #
# alone; on Linux it also runs the tests under ASan and UBSan, BigInteger     #
# with its portable products, the backends required, with the parallel gemm() #
# on OpenBLAS under ThreadSanitizer, the executors of OpenMP, oneTBB and      #
# FastFlow by the makefile, with the long-lived workers, their channels, the  #
# farm and the mailbox, the sort and the runtime over the processes of Open   #
# MPI and of MPICH, FastHash and the vector quicksort on AVX2 (and AVX-512    #
# when the runner has it), ConcurrentFlatTable on the compare-and-swap of 16  #
# bytes, the queues between threads, the event count, the MultiQueue, the     #
# concurrent hash tables, the parallel operations of the trees by join, the   #
# parallel builds of the succinct structures, the stepping algorithms of the  #
# shortest paths and the runtime of the workers under ThreadSanitizer, and    #
# FlatHashTable on its broadword fallback; it measures the coverage of the    #
# tests, run four at a time and with the cases there for their scale alone    #
# made smaller, and sends it to Coveralls; it builds the C++20 module ads and #
# runs the test that imports it, by CMake and Ninja with Clang and GCC 15 on  #
# Linux and the Clang of LLVM on macOS, and by the makefile with clang++ and  #
# g++ 15.                                                                     #
###############################################################################

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a new push to a branch cancels the run still going on its previous commit,
# except on main, where every commit is tested: there each commit is a group
# of its own, since a group keeps one waiting run and cancels the others
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # every program built and every test run by CMake and by the makefiles,
  # four at a time, and the installed package used through find_package and
  # pkg-config [see packaging/test]; on Windows, MSVC by CMake alone and the
  # compilers of MSYS2, whose bash runs the makefiles; GMP and a CBLAS are
  # installed where the runner lacks them, the default builds must find
  # them (but the CBLAS on MSYS2 and with the g++ of macOS, and both with
  # MSVC), and the makefiles run the tests again with both off
  test:
    name: test (${{ matrix.os }}, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest , compiler: g++ , cxx: g++ }
          - { os: ubuntu-latest , compiler: clang++ , cxx: clang++ }
          - { os: macos-latest , compiler: clang++ , cxx: clang++ }
          - { os: macos-latest , compiler: g++ , cxx: g++-15 }
          - { os: windows-latest , compiler: msvc }
          - { os: windows-latest , compiler: g++ , cxx: g++ ,
              msystem: UCRT64 , cc: gcc }
          - { os: windows-latest , compiler: clang++ , cxx: clang++ ,
              msystem: CLANG64 , cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.msystem && 'msys2 {0}' || 'bash' }}
    env:
      CXX: ${{ matrix.cxx }}
      GEN: ${{ matrix.msystem && '-G Ninja' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: the compiler, CMake, Ninja and make of MSYS2
        if: matrix.msystem
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make
          pacboy: >-
            ${{ matrix.cc }}:p cmake:p ninja:p pkgconf:p gmp:p
      - name: the g++ of Homebrew
        if: runner.os == 'macOS' && matrix.compiler == 'g++'
        run: command -v "$CXX" || brew install gcc@15
      - name: GMP and OpenBLAS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libopenblas-dev
      - name: GMP of Homebrew
        if: runner.os == 'macOS'
        run: brew list gmp > /dev/null 2>&1 || brew install gmp
      - name: CMake
        run: |
          inst="$PWD/inst"
          if command -v cygpath > /dev/null; then
            inst=$(cygpath -m "$inst")
          fi
          echo "INST=$inst" >> "$GITHUB_ENV"
          set -o pipefail
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$inst" | tee cmake.log
          if [ "${{ matrix.compiler }}" != msvc ]; then
            grep -q 'ADS: GMP ON' cmake.log
          fi
          if [ -z "${{ matrix.msystem }}" ] &&
             [ "${{ matrix.compiler }}" != msvc ] &&
             [ "$RUNNER_OS-${{ matrix.compiler }}" != macOS-g++ ]; then
            grep -q 'CBLAS ON' cmake.log
          fi
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --parallel 4 --output-on-failure
      - name: installed, and found by find_package and pkg-config
        run: |
          cmake --install build --config Release
          test -f "$INST/include/ADS/ADSConfig.h"
          cmake -S packaging/test -B build-use $GEN \
                -DCMAKE_PREFIX_PATH="$INST"
          cmake --build build-use --config Release
          ctest --test-dir build-use -C Release --output-on-failure
      - name: makefile, on the backends found and with both off
        if: matrix.compiler != 'msvc'
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          make backends
          make -j4 test
          make -j4 test ADS_WITH_GMP=0 ADS_WITH_BLAS=0 BUILD=build-off

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BigInteger with the products by halves of 32 bits
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Iinclude -Itest \
              -DADS_CONTRACTS=3 -DADS_BIGINT_PORTABLE -o portable \
              test/taocp.cpp -pthread
          for t in $(./portable -l | grep -E '^(big-integer|rational)'); do
            ./portable $t
          done

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ConcurrentFlatTable on the compare-and-swap of 16 bytes
        run: |
          g++ -std=c++20 -O2 -mcx16 -Iinclude -Itest -DADS_CONTRACTS=3 \
              -o cas16 test/engineered.cpp -pthread
          for t in concurrent-flat-table concurrent-flat-table-threads \
                   concurrent-flat-table-words; do
            ./cas16 $t
          done
      - name: FastHash on the stripes of AVX2, the same hashes as without
        run: |
          g++ -std=c++20 -O2 -march=x86-64-v3 -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o vectors test/hashing.cpp -pthread
          ./vectors fast-hash
      - name: vectorQuickSort() and sort() on AVX2, and on AVX-512 if there
        run: |
          march="x86-64-v3"
          grep -qw avx512f /proc/cpuinfo && march="$march x86-64-v4"
          for m in $march; do
            g++ -std=c++20 -O1 -g -fsanitize=address,undefined -march=$m \
                -Iinclude -Itest -DADS_CONTRACTS=3 -o sorts test/sorting.cpp
            for t in vector-quicksort dispatch dispatch-edges fast-paths; do
              ./sorts $t
            done
          done

  # the backends required, by the makefile and by CMake, the installed
  # package found again, and the parallel gemm() on OpenBLAS under
  # ThreadSanitizer
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libopenblas-dev
      - name: the tests on GMP and OpenBLAS, by the makefile
        env:
          OPENBLAS_NUM_THREADS: 2
        run: make -j4 test ADS_WITH_GMP=1 ADS_WITH_BLAS=1 BUILD=build-on
      - name: the same by CMake, installed and found by find_package
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADS_WITH_GMP=ON \
                -DADS_WITH_BLAS=ON -DCMAKE_INSTALL_PREFIX="$PWD/inst"
          cmake --build build --parallel 4
          ctest --test-dir build --parallel 4 --output-on-failure
          cmake --install build
          cmake -S packaging/test -B build-use \
                -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use
          ctest --test-dir build-use --output-on-failure
      - name: the parallel gemm() on OpenBLAS under ThreadSanitizer
        env:
          OPENBLAS_NUM_THREADS: 1
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -DADS_WITH_BLAS -o tsan-blas \
              test/engineered_parallel.cpp -pthread -lopenblas
          ./tsan-blas parallel-numeric
      - name: CMake with both off
        run: |
          set -o pipefail
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release \
                -DADS_WITH_GMP=OFF -DADS_WITH_BLAS=OFF | tee cmake.log
          grep -q 'ADS: GMP OFF, CBLAS OFF' cmake.log
          cmake --build build-off --parallel 4
          ctest --test-dir build-off --parallel 4 --output-on-failure

  executors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: oneTBB and FastFlow
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev
          git clone --quiet --depth 1 \
              https://github.com/fastflow/fastflow.git "$RUNNER_TEMP/ff"
      - name: the tests of the executors, by the makefile
        run: |
          make -j4 BUILD=build-exec ADS_WITH_OPENMP=1 ADS_WITH_TBB=1 \
               ADS_WITH_FASTFLOW=1 FastFlow_ROOT="$RUNNER_TEMP/ff" \
               build-exec/engineered_parallel \
               build-exec/engineered_speculative build-exec/engineered_runtime
          for p in engineered_parallel engineered_speculative \
                   engineered_runtime; do
            for t in $(build-exec/$p -l); do build-exec/$p $t; done
          done

  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer on the queues between threads
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan spsc-queue
          ./tsan mpsc-inbox
      - name: ThreadSanitizer on the event count, with several notifiers
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq event-count
          ./tsanq event-count-notifiers
      - name: ThreadSanitizer on the MultiQueue and the concurrent tables
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsanq test/engineered_queues.cpp -pthread
          ./tsanq multi-queue-threads
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan test/engineered.cpp -pthread
          ./tsan concurrent-flat-table-threads
          ./tsan concurrent-cuckoo-threads
          g++ -std=c++20 -O1 -g -fsanitize=thread -mcx16 -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan16 test/engineered.cpp -pthread
          ./tsan16 concurrent-flat-table-words
      - name: ThreadSanitizer on the backoff and the packed arrays
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -DADS_TEST_SMALL -o tsan-search \
              test/engineered_search.cpp -pthread
          for t in backoff-threads packed-array trit-array affinity; do
            ./tsan-search $t
          done
      - name: ThreadSanitizer on the bulk operations of the trees by join
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-joins test/join_trees.cpp -pthread
          ./tsan-joins join-executors
          ./tsan-joins interval-tree
          ./tsan-joins range-tree
      - name: ThreadSanitizer on the deterministic reservations
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-spec test/engineered_speculative.cpp \
              -pthread
          for t in $(./tsan-spec -l); do ./tsan-spec $t; done
      - name: ThreadSanitizer on the parallel builds and the stepping
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-par test/engineered_parallel.cpp \
              -pthread
          ./tsan-par parallel-rank-select
          ./tsan-par parallel-wavelet-matrix
          ./tsan-par parallel-huffman-wavelet-tree
          ./tsan-par parallel-stepping
      - name: ThreadSanitizer on the workers, the channels and the mailbox
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          g++ -std=c++20 -O1 -g -fsanitize=thread -Iinclude -Itest \
              -DADS_CONTRACTS=3 -o tsan-rt test/engineered_runtime.cpp \
              -pthread
          for t in $(./tsan-rt -l); do ./tsan-rt $t; done

  # the sort and the runtime over the processes of MPI on 1 to 4 processes,
  # by the makefile and by CMake, on Open MPI and on MPICH; the other jobs
  # find no MPI, and build ADS without it
  mpi:
    name: mpi (${{ matrix.mpi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mpi: openmpi , packages: libopenmpi-dev openmpi-bin ,
              preflags: --oversubscribe }
          - { mpi: mpich , packages: libmpich-dev mpich , preflags: "" }
    runs-on: ubuntu-latest
    # the runners have no InfiniBand: UCX on its shared memory and TCP alone,
    # since its probe of the verbs makes MPI_Init fail on some of them
    env:
      UCX_TLS: self,sm,tcp
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.mpi }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: the tests over MPI, by the makefile
        run: |
          make backends | tee backends.log
          grep -q 'ADS: MPI ON' backends.log
          make test-mpi BUILD=build-mpi
      - name: the same by CMake, MPI required
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADS_WITH_MPI=ON \
                -DMPIEXEC_PREFLAGS="${{ matrix.preflags }}" | tee cmake.log
          grep -q 'ADS: MPI ON' cmake.log
          cmake --build build --parallel 4 --target engineered_mpi
          ctest --test-dir build -R '^engineered_mpi[.]' --output-on-failure

  broadword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FlatHashTable on SWAR instead of SSE2, under ASan and UBSan
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
              -Iinclude -Itest -DADS_CONTRACTS=3 -DADS_FLAT_SIMD=0 \
              -o swar test/engineered.cpp -pthread
          ./swar flat-hash-table

  coverage:
    # the programs dealt in turn to three jobs, each building its own and
    # running their tests four at a time, the longest tests first (gcov
    # merges the counters of the processes of one program under a lock),
    # the cases there for their scale alone made smaller by ADS_TEST_SMALL
    # [see ADSTest.h]; Coveralls merges the three reports; the list against
    # the programs is checked by the other jobs
    name: coverage (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0 , 1 , 2 ]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: the tests with the coverage of gcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          awk '/^[a-z]/{print $1}' test/tests.txt | sort -u |
            awk '( NR - 1 ) % 3 == ${{ matrix.shard }}' > programs
          make -j4 BUILD=build-cov CXXFLAGS="-std=c++20 -O0 -g --coverage \
               -Wall -Wextra -DADS_TEST_SMALL" \
               $(sed 's|^|build-cov/|' programs)
          awk 'NR == FNR { p[ $1 ] ; next } /^[a-z]/ && ( $1 in p ) {
                 print $1, $2 }' programs test/tests.txt > tests
          grep -E ' (big-integer-gmp|.*parallel-sort)$' tests > first || true
          { cat first; grep -vxFf first tests; } |
            xargs -P 4 -n 2 sh -c 'build-cov/$0 $1'
          lcov --capture --directory build-cov --output-file lcov.info \
               --ignore-errors mismatch,inconsistent,unused
          lcov --extract lcov.info "$PWD/include/*" \
               --output-file lcov.info --ignore-errors unused
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          flag-name: shard-${{ matrix.shard }}
          parallel: true
          fail-on-error: false

  coverage-done:
    # the three reports of the coverage closed into one build of Coveralls
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false

  sanitizers:
    # the programs built and run four at a time, the cases there for their
    # scale alone made smaller by ADS_TEST_SMALL [see ADSTest.h]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          SAN: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          make -j4 test \
               CXXFLAGS="-std=c++20 -O1 -g $SAN -Wall -Wextra -DADS_TEST_SMALL"

  # the module by CMake: a build where it was turned off fails, as does one
  # where ctest finds no test module; GCC 15, which the runners lack, from
  # its image
  module-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest , cxx: clang++ }
          - { os: ubuntu-latest , cxx: g++ , image: "gcc:15" }
          - { os: macos-latest , cxx: llvm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Ninja and clang-scan-deps
        if: runner.os == 'Linux' && !matrix.image
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tools
      - name: CMake and Ninja in the image of GCC
        if: matrix.image
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
      - name: Ninja and LLVM
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          llvm=$(brew --prefix llvm)
          echo "CXX=$llvm/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L$llvm/lib/c++ -Wl,-rpath,$llvm/lib/c++" \
               >> $GITHUB_ENV
      - name: the compiler
        if: runner.os == 'Linux'
        run: echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DADS_BUILD_MODULE=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst" 2>&1 | tee cmake.log
          ! grep -q 'ADS_BUILD_MODULE is turned OFF' cmake.log
          cmake --build build --target module
          ctest --test-dir build -R '^module$' --no-tests=error \
                --output-on-failure
      - name: installed and imported through find_package
        shell: bash
        run: |
          cmake --install build
          test -f inst/include/ADS/modules/ADS.cppm
          cmake -S packaging/test -B build-use -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-use --target use-module
          ctest --test-dir build-use -R '^use-module$' --no-tests=error \
                --output-on-failure

  # the module by the makefile: make builds build-make/module only with the
  # module, the rule of the other tests failing on its import
  module-make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: clang++ }
          - { cxx: g++ , image: "gcc:15" }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: the module and its test
        shell: bash
        run: |
          set -o pipefail
          make ADSMOD=1 CXX=${{ matrix.cxx }} build-make/module 2>&1 \
               | tee make.log
          ! grep -q 'ADSMOD is turned off' make.log
          build-make/module
