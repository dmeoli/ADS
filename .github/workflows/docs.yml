###############################################################################
#                                 docs.yml                                    #
#                                                                             #
# Builds the documentation of ADS and publishes it on the pages of the        #
# repository at each push to main: the site of Sphinx with the theme of Read  #
# the Docs, whose pages docs/pages.py writes from the README and the          #
# CHANGELOG and whose API reference docs/apiref.py writes from the XML of     #
# Doxygen, and in its folder doxygen the Doxygen site, with the theme of      #
# doxygen-awesome-css and the same tree of the reference under its Topics.    #
# On a pull request it only builds them, and leaves the site as an artifact   #
# of the run. The steps of the build are in docs/build.sh, which fails on     #
# any warning.                                                                #
###############################################################################

name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOXYGEN_VERSION: '1.17.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the Doxygen of the releases, since that of Ubuntu (1.9) has neither
      # the outline of the pages nor the sidebar that the theme expects
      - name: Doxygen
        run: |
          v=$DOXYGEN_VERSION
          url=https://github.com/doxygen/doxygen/releases/download
          curl -sSfL -o doxygen.tar.gz \
               "$url/Release_${v//./_}/doxygen-$v.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-$v/bin" >> "$GITHUB_PATH"
      - name: the two sites
        run: |
          pip install -r docs/requirements.txt
          bash docs/build.sh
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/html
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build-docs/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
