###############################################################################
#                                 docs.yml                                    #
#                                                                             #
# Builds the documentation of ADS and publishes it on the pages of the        #
# repository at each push to main: the site of Sphinx with the theme of Read  #
# the Docs, whose pages docs/pages.py writes from the README and the          #
# CHANGELOG and whose API reference docs/apiref.py writes from the XML of     #
# Doxygen, and in its folder doxygen the Doxygen site, with the theme of      #
# doxygen-awesome-css and the same tree of the reference under its Topics.    #
# On a pull request it only builds them, and leaves the site as an artifact   #
# of the run.                                                                 #
###############################################################################

name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOXYGEN: '1.17.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the Doxygen of the releases, since that of Ubuntu (1.9) has neither
      # the outline of the pages nor the sidebar that the theme expects
      - name: Doxygen
        run: |
          v=$DOXYGEN
          url=https://github.com/doxygen/doxygen/releases/download
          curl -sSfL -o doxygen.tar.gz \
               "$url/Release_${v//./_}/doxygen-$v.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-$v/bin" >> "$GITHUB_PATH"
      - name: the Doxygen site and the XML
        run: |
          doxygen --version
          # a first run writes the XML of the headers alone, from which
          # docs/pages.py writes the pages of Sphinx, the main page of the
          # Doxygen site and the groups of its Topics; a second run with
          # them writes the HTML
          (cat docs/Doxyfile; echo "GENERATE_HTML = NO";
           echo "INPUT = include/ADS"; echo "USE_MDFILE_AS_MAINPAGE =") |
              doxygen -
          python3 docs/pages.py
          (cat docs/Doxyfile; echo "INPUT += build-docs/topics.dox";
           echo "GENERATE_XML = NO") | doxygen -
          # the outline of a page in navtree.js turns its names into
          # entities and then sets them as text, which shows "&#x2F;" for
          # "/"
          sed -i \
              's/textContent = escapeHtml(\(text\|name\))/textContent = \1/' \
              build-docs/doxygen/navtree.js
          test "$(grep -c 'textContent = escapeHtml' \
                  build-docs/doxygen/navtree.js)" = 0
          # the overloads in the outline with the types of their parameters
          cat docs/doxygen/outline-overloads.js \
              >> build-docs/doxygen/navtree.js
      - name: the site of Sphinx
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -b html -d build-docs/doctrees docs build-docs/html
          mv build-docs/doxygen build-docs/html/doxygen
          touch build-docs/html/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/html
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build-docs/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
